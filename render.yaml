services:
  - type: web
    name: spread-model-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true

  - type: web
    name: spread-model
    runtime: static
    plan: free
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://spread-model-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
